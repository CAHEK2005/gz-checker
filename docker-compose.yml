services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gz_checker}
      POSTGRES_USER: ${POSTGRES_USER:-gz_checker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gz_checker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gz_checker} -d ${POSTGRES_DB:-gz_checker}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-gz_checker}
      POSTGRES_USER: ${POSTGRES_USER:-gz_checker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gz_checker}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
